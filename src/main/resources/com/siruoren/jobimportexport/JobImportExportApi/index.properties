page.title=API Documentation
page.heading=Job Import/Export REST API
page.subtitle=Programmatically call import/export functions via REST API
info.crumb=All POST endpoints require Jenkins CRUMB (CSRF protection). Please obtain CRUMB from /crumbIssuer/api/json and include it in the request header.
info.permission=All API endpoints use permission checks consistent with the web UI, using Jenkins standard checkPermission() mechanism. Insufficient permissions will return 403 error.

exportJob.desc=Export single job config
exportJob.detail=Export the config.xml of a single job. Returns job metadata and XML content.
exportJob.param.job=Job full name, e.g. my-folder/my-job

exportFolder.desc=Export folder as ZIP
exportFolder.detail=Export all jobs under a folder as a ZIP file, encoded as Base64 string.
exportFolder.param.folder=Folder full name, e.g. my-folder
exportFolder.param.includeCurrentConfig=Whether to include the folder's own config.xml (default: false)

exportAll.desc=Export all jobs (Admin only)
exportAll.detail=Export all jobs from Jenkins root directory as a ZIP file, encoded as Base64 string. Requires administrator permission.

import.desc=Batch import jobs
import.detail=Import jobs from a ZIP file. This is an asynchronous operation - returns a batchId immediately, use the progress API to check import status.
import.param.zipFile=ZIP file containing job configurations
import.param.overwrite=Overwrite existing jobs (default: false)
import.param.rename=Auto-rename conflicting jobs (default: false)
import.param.dryRun=Dry run mode, only check without importing (default: false)
import.param.targetFolder=Target folder full name, empty means Jenkins root

preview.desc=Preview import (dry-run)
preview.detail=Preview import from a ZIP file without actually importing. Returns detailed results of what would happen.

updateJob.desc=Update job config
updateJob.detail=Update a job's config.xml. Supports file upload or direct XML content.
updateJob.param.job=Job full name, e.g. my-folder/my-job
updateJob.param.xmlFile=XML file upload (alternative to configXml)
updateJob.param.configXml=XML content string (alternative to xmlFile)

progress.desc=Query import progress
progress.detail=Query the progress of an asynchronous import task. Returns current job, progress percentage and status.
progress.param.batchId=Batch ID returned by the import API

list.desc=List jobs/folders
list.detail=List jobs and folders under a specified path. Returns name, type, URL and other information.
list.param.folder=Folder full name, empty means Jenkins root

error.desc=Error Response Format
error.detail=All API errors return a unified JSON format containing success, message and errorCode fields.
error.400=Missing required parameters or invalid request
error.403=Insufficient permissions (Jenkins checkPermission failed)
error.404=Specified job or folder not found
error.500=Internal server error
error.503=Server busy, import queue full

