page.title=API Documentation
page.heading=Job Import/Export REST API
page.subtitle=Programmatically call import/export functions via REST API. Supports batch operations, dry-run preview, and nested folder structures.
info.crumb=All POST endpoints require Jenkins CRUMB (CSRF protection). The "Try it out" feature automatically handles CRUMB acquisition.
info.permission=All API endpoints use permission checks consistent with the web UI, using Jenkins standard checkPermission() mechanism. Insufficient permissions will return 403 error.

exportJob.desc=Export single job config
exportJob.detail=Export the config.xml of a single job. Returns job metadata and XML content in JSON response. Set download=true to directly download the XML file.
exportJob.param.job=Job full name (supports nested folders), e.g. my-folder/my-job
exportJob.param.download=Whether to download the XML file directly instead of returning JSON (default: false)

exportFolder.desc=Export folder as ZIP
exportFolder.detail=Export all jobs under a folder as a ZIP file. Returns Base64 encoded ZIP in JSON by default. Set download=true to directly download the ZIP file. Supports nested folder structures.
exportFolder.param.folder=Folder full name, e.g. my-folder/nested-folder
exportFolder.param.includeCurrentConfig=Whether to include the folder's own config.xml (default: false). Useful for migrating folder structures.
exportFolder.param.download=Whether to download the ZIP file directly instead of returning JSON (default: false)

exportAll.desc=Export all jobs (Admin only)
exportAll.detail=Export all jobs from Jenkins root directory as a ZIP file. Returns Base64 encoded ZIP by default. Set download=true to directly download the ZIP file. Requires Jenkins administrator permission.
exportAll.param.download=Whether to download the ZIP file directly instead of returning JSON (default: false)

import.desc=Batch import jobs
import.detail=Import jobs from a ZIP file. This is an asynchronous operation - returns a batchId immediately. Use the progress API to check import status and results. Supports nested folder creation.
import.param.zipFile=ZIP file containing job configurations (supports nested directory structure)
import.param.overwrite=Overwrite existing jobs with the same name (default: false)
import.param.rename=Auto-rename conflicting jobs by appending numeric suffix (default: false)
import.param.dryRun=Dry run mode, only validate without importing (default: false). Use preview API instead for better validation.
import.param.targetFolder=Target folder full name for imported jobs, empty means Jenkins root

preview.desc=Preview import (dry-run)
preview.detail=Preview import from a ZIP file without actually importing. Returns detailed results showing what would be created, updated, or skipped. Use this before actual import to validate.

updateJob.desc=Update job config
updateJob.detail=Update a job's config.xml. Supports either file upload or direct XML content string. The job will be reloaded after update.
updateJob.param.job=Job full name (supports nested folders), e.g. my-folder/my-job
updateJob.param.xmlFile=XML file upload (alternative to configXml)
updateJob.param.configXml=XML content string (alternative to xmlFile). Either xmlFile or configXml is required.

progress.desc=Query import progress
progress.detail=Query the progress of an asynchronous import task. Returns current job being processed, progress percentage, status, and final results when complete.
progress.param.batchId=Batch ID returned by the import API

list.desc=List jobs/folders
list.detail=List jobs and folders under a specified path. Returns hierarchical structure with name, fullName, URL, type, and class information. Supports nested folders.
list.param.folder=Folder full name to list, empty means Jenkins root

error.desc=Error Response Format
error.detail=All API errors return a unified JSON format containing success, message and errorCode fields.
error.400=Missing required parameters or invalid request
error.403=Insufficient permissions (Jenkins checkPermission failed)
error.404=Specified job or folder not found
error.500=Internal server error
error.503=Server busy, import queue full

