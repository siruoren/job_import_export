page.title=API 文档
page.heading=任务导入/导出 REST API
page.subtitle=通过 REST API 程序化调用导入/导出功能。支持批量操作、Dry-Run 预演和嵌套目录结构。
info.crumb=所有 POST 端点均需携带 Jenkins CRUMB（CSRF 防护）。"在线测试"功能会自动处理 CRUMB 获取。
info.permission=所有 API 端点的权限检查与 Web 页面完全一致，使用 Jenkins 标准的 checkPermission() 机制。权限不足将返回 403 错误。

exportJob.desc=导出单个任务配置
exportJob.detail=导出单个任务的 config.xml。默认返回包含任务元数据和 XML 内容的 JSON。设置 download=true 可直接下载 XML 文件。
exportJob.param.job=任务全名（支持嵌套目录），如 my-folder/my-job
exportJob.param.download=是否直接下载 XML 文件而不返回 JSON（默认：false）

exportFolder.desc=导出目录为 ZIP
exportFolder.detail=将目录下所有任务导出为 ZIP 文件。默认返回 Base64 编码的 ZIP。设置 download=true 可直接下载 ZIP 文件。支持嵌套目录结构。
exportFolder.param.folder=目录全名，如 my-folder/nested-folder
exportFolder.param.includeCurrentConfig=是否包含目录自身的 config.xml（默认：false）。迁移目录结构时非常有用。
exportFolder.param.download=是否直接下载 ZIP 文件而不返回 JSON（默认：false）

exportAll.desc=导出全部任务（仅管理员）
exportAll.detail=将 Jenkins 根目录下所有任务导出为 ZIP 文件。默认返回 Base64 编码的 ZIP。设置 download=true 可直接下载 ZIP 文件。需要 Jenkins 管理员权限。
exportAll.param.download=是否直接下载 ZIP 文件而不返回 JSON（默认：false）

import.desc=批量导入任务
import.detail=从 ZIP 文件导入任务。此为异步操作，立即返回 batchId。使用进度查询 API 查看导入状态和结果。支持嵌套目录创建。
import.param.zipFile=包含任务配置的 ZIP 文件（支持嵌套目录结构）
import.param.overwrite=覆盖同名已存在的任务（默认：false）
import.param.rename=自动重命名冲突任务（添加数字后缀，默认：false）
import.param.dryRun=Dry Run 模式，仅验证不实际导入（默认：false）。建议使用 preview API 进行更好的验证。
import.param.targetFolder=导入任务的目标目录全名，为空表示 Jenkins 根目录

preview.desc=预演导入（dry-run）
preview.detail=从 ZIP 文件预演导入，不实际执行导入操作。返回详细结果，显示将会创建、更新或跳过的任务。建议在实际导入前使用此 API 验证。

updateJob.desc=更新任务配置
updateJob.detail=更新任务的 config.xml。支持文件上传或直接传入 XML 内容字符串。更新后任务会自动重载。
updateJob.param.job=任务全名（支持嵌套目录），如 my-folder/my-job
updateJob.param.xmlFile=XML 文件上传（与 configXml 二选一）
updateJob.param.configXml=XML 内容字符串（与 xmlFile 二选一）。必须提供 xmlFile 或 configXml 其中之一。

progress.desc=查询导入进度
progress.detail=查询异步导入任务的进度。返回当前正在处理的任务、进度百分比、状态，以及完成时的最终结果。
progress.param.batchId=导入 API 返回的批次 ID

list.desc=列出任务/目录
list.detail=列出指定路径下的任务和目录。返回层次结构，包含名称、全名、URL、类型和类信息。支持嵌套目录。
list.param.folder=要列出的目录全名，为空表示 Jenkins 根目录

error.desc=错误响应格式
error.detail=所有 API 错误统一返回 JSON 格式，包含 success、message 和 errorCode 字段。
error.400=缺少必要参数或请求无效
error.403=权限不足（Jenkins checkPermission 校验失败）
error.404=指定的任务或目录不存在
error.500=服务器内部错误
error.503=服务器繁忙，导入队列已满

