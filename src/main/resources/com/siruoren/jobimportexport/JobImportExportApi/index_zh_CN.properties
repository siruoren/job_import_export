page.title=API 文档
page.heading=任务导入/导出 REST API
page.subtitle=通过 REST API 程序化调用导入/导出功能
info.crumb=所有 POST 端点均需携带 Jenkins CRUMB（CSRF 防护），请从 /crumbIssuer/api/json 获取 CRUMB 并添加到请求头中。
info.permission=所有 API 端点的权限检查与 Web 页面完全一致，使用 Jenkins 标准的 checkPermission() 机制。权限不足将返回 403 错误。

exportJob.desc=导出单个任务配置
exportJob.detail=导出单个任务的 config.xml，返回任务元数据和 XML 内容。
exportJob.param.job=任务全名，如 my-folder/my-job

exportFolder.desc=导出目录为 ZIP
exportFolder.detail=将目录下所有任务导出为 ZIP 文件，以 Base64 编码字符串返回。
exportFolder.param.folder=目录全名，如 my-folder
exportFolder.param.includeCurrentConfig=是否包含目录自身的 config.xml（默认：false）

exportAll.desc=导出全部任务（仅管理员）
exportAll.detail=将 Jenkins 根目录下所有任务导出为 ZIP 文件，以 Base64 编码字符串返回。需要管理员权限。

import.desc=批量导入任务
import.detail=从 ZIP 文件导入任务。此为异步操作，立即返回 batchId，请使用进度查询 API 查看导入状态。
import.param.zipFile=包含任务配置的 ZIP 文件
import.param.overwrite=覆盖已存在的任务（默认：false）
import.param.rename=自动重命名冲突任务（默认：false）
import.param.dryRun=Dry Run 模式，仅检查不实际导入（默认：false）
import.param.targetFolder=目标目录全名，为空表示 Jenkins 根目录

preview.desc=预演导入（dry-run）
preview.detail=从 ZIP 文件预演导入，不实际执行导入操作。返回详细的预演结果。

updateJob.desc=更新任务配置
updateJob.detail=更新任务的 config.xml。支持文件上传或直接传入 XML 内容。
updateJob.param.job=任务全名，如 my-folder/my-job
updateJob.param.xmlFile=XML 文件上传（与 configXml 二选一）
updateJob.param.configXml=XML 内容字符串（与 xmlFile 二选一）

progress.desc=查询导入进度
progress.detail=查询异步导入任务的进度。返回当前任务、进度百分比和状态。
progress.param.batchId=导入 API 返回的批次 ID

list.desc=列出任务/目录
list.detail=列出指定路径下的任务和目录。返回名称、类型、URL 等信息。
list.param.folder=目录全名，为空表示 Jenkins 根目录

error.desc=错误响应格式
error.detail=所有 API 错误统一返回 JSON 格式，包含 success、message 和 errorCode 字段。
error.400=缺少必要参数或请求无效
error.403=权限不足（Jenkins checkPermission 校验失败）
error.404=指定的任务或目录不存在
error.500=服务器内部错误
error.503=服务器繁忙，导入队列已满

label.permission=权限
label.params=参数
label.curlExample=cURL 示例
label.response=响应示例
label.tryIt=试一试
label.send=发送请求
label.required=必填
label.optional=可选
label.noAuth=无需特定权限

col.param=参数
col.type=类型
col.required=必填
col.desc=说明
col.code=HTTP 状态码
col.meaning=含义
